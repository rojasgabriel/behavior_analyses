name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Start SSH agent for private dependencies
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.DJCHURCHLAND_DEPLOY_KEY }}

      - name: Route djchurchland through its deploy key
        run: git config --global url."git@github.com:churchlandlab/djchurchland".insteadOf "https://github.com/churchlandlab/djchurchland"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uvx ruff check .

      - name: Check formatting
        run: uvx ruff format --check .
